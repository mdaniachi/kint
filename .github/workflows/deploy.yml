name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: garment-algorithm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: garment-algorithm/package-lock.json

      - run: npm ci

      # Fetches the weights, the ONNX runtime and the inference library into
      # public/. They are build artefacts, not source: reproduced by one
      # command, and baked into the deployed site so it serves every one of
      # them from this domain. Committing 65 MB of binary would buy nothing.
      - name: Fetch model and runtime
        run: npm run setup:model

      - name: Build static site
        run: npm run build:static
        env:
          NEXT_PUBLIC_BASE_PATH: /kint

      - uses: actions/upload-pages-artifact@v3
        with:
          path: garment-algorithm/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
